<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }
        .card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
        .card:hover {
            transform: scale(1.05);
            border-color: #4CAF50;
        }
    </style>
</head>
<body>

    <h1>My Unblocked Arcade</h1>

    <div class="grid">
        <!-- Minecraft Button -->
        <a href="minecraft.html" class="card">
            Minecraft (1.8.8)
        </a>
        
        <!-- Add more game cards below by copying this structure -->
    </div>

</body>
</html>
